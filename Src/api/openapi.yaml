          type: array
          maxItems: 32
          items: { type: string, maxLength: 200 }
        managed_version: { type: string, maxLength: 64 }
        update_state: { type: string, enum: [current, available, degraded] }
        install_state: { type: string, enum: [installed, available] }
        capability_id: { type: string, format: uuid }
        availability: { $ref: "#/components/schemas/ResourceAvailability" }
    ResourceAvailability:
      type: string
      enum: [available, degraded, disabled, quarantined]
      description: Stable user-facing availability. MCP is available only after a successful health check.
    SecretBinding:
      type: object
      required: [name, target, required]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        target:
          type: string
          pattern: "^(env|header):[^\\r\\n]+$"
          description: Destination only. Secret values are written through SecretStore and never appear in this object.
        required: { type: boolean }
    MCPDefinitionV1:
      type: object
      required: [schema_version, source, transport, auth]
      additionalProperties: false
      properties:
        schema_version: { type: string, enum: [oktapod.mcp/v1] }
        source:
          type: object
          required: [type]
          additionalProperties: false
          properties:
            type: { type: string, enum: [official, registry, npm, pypi, url, local, manual] }
            reference: { type: string, maxLength: 2048 }
            version: { type: string, maxLength: 128 }
            publisher: { type: string, maxLength: 200 }
        transport:
          oneOf:
            - type: object
              required: [type, command]
              additionalProperties: false
              properties:
                type: { type: string, enum: [stdio] }
                command: { type: string, minLength: 1, maxLength: 2048 }
                args:
                  type: array
                  maxItems: 128
                  items: { type: string, maxLength: 4096 }
                auth_env: { type: string, maxLength: 128 }
            - type: object
              required: [type, url]
              additionalProperties: false
              properties:
                type: { type: string, enum: [streamable_http] }
                url: { type: string, format: uri, maxLength: 2048 }
        auth:
          type: object
          required: [type]
          additionalProperties: false
          description: Authentication mode. oauth uses the MCP Go SDK authorization-code flow with a loopback browser callback and encrypted refresh-token persistence; manually supplied access tokens use bearer.
          properties:
            type: { type: string, enum: [none, environment, bearer, oauth, custom_header] }
            header: { type: string, maxLength: 128 }
        secret_bindings:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/SecretBinding" }
        headers:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 4096 }
        permissions:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
    ResourceInstallDraft:
      type: object
      required: [id, kind, source_input, status, warnings, required_secrets, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [skill, mcp, agent] }
        source_input: { type: string, maxLength: 8192 }
        resolved_name: { type: string, maxLength: 120 }
        resolved_version: { type: string, maxLength: 128 }
        mcp_definition: { $ref: "#/components/schemas/MCPDefinitionV1" }
