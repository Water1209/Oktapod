          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MCPInstallCandidate" }
        status: { type: string, enum: [draft, needs_secret, validated, rejected, installed] }
        warnings:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 1000 }
        required_secrets:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/SecretBinding" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
