components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    BootstrapConfiguration:
      type: object
      required: [profile, listen_address, data_root, run_concurrency, database_driver, trusted_keys_file, config_path, source, restart_required, web_access]
      properties:
        profile: { type: string, enum: [personal, team] }
        listen_address: { type: string }
        data_root: { type: string }
        run_concurrency: { type: integer, minimum: 1, maximum: 4 }
        database_driver: { type: string, enum: [sqlite, postgresql] }
        trusted_keys_file: { type: string }
        config_path: { type: string }
        source: { type: string }
        restart_required: { type: boolean }
        web_access: { $ref: "#/components/schemas/WebAccessConfiguration" }
    UpdateBootstrapConfiguration:
      type: object
      additionalProperties: false
      properties:
        profile: { type: string, enum: [personal, team] }
        listen_address: { type: string, minLength: 1, maxLength: 255 }
        data_root: { type: string, maxLength: 2048 }
        run_concurrency: { type: integer, minimum: 1, maximum: 4 }
        database_driver: { type: string, enum: [sqlite, postgresql] }
        trusted_keys_file: { type: string, maxLength: 2048 }
        web_access: { $ref: "#/components/schemas/UpdateWebAccessConfiguration" }
    WebPrivateOrigin:
      type: object
      required: [id, origin]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
        origin: { type: string, minLength: 1, maxLength: 255, description: "Exact HTTP(S) origin with a literal IPv4/IPv6 address and explicit port." }
    PrivateFetchConfiguration:
      type: object
      required: [enabled, allowed_origins, allowed_origin_count, origins_redacted]
      properties:
        enabled: { type: boolean }
        allowed_origins:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WebPrivateOrigin" }
        allowed_origin_count: { type: integer, minimum: 0, maximum: 64 }
        origins_redacted: { type: boolean }
    WebAccessConfiguration:
      type: object
      required: [private_fetch]
      properties:
        private_fetch: { $ref: "#/components/schemas/PrivateFetchConfiguration" }
    UpdatePrivateFetchConfiguration:
      type: object
      required: [enabled, allowed_origins]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        allowed_origins:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/WebPrivateOrigin" }
    UpdateWebAccessConfiguration:
      type: object
      required: [private_fetch]
      additionalProperties: false
      properties:
        private_fetch: { $ref: "#/components/schemas/UpdatePrivateFetchConfiguration" }
    AIGovernanceSettings:
      type: object
      required: [reviewer_provider_id, reviewer_model_id, enabled, timeout_seconds, fail_closed, policy_version, updated_at]
      properties:
        reviewer_provider_id: { type: string }
        reviewer_model_id: { type: string }
        enabled: { type: boolean }
        timeout_seconds: { type: integer, minimum: 5, maximum: 120 }
        fail_closed: { type: boolean, enum: [true] }
        policy_version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    UpdateAIGovernanceSettings:
      type: object
      required: [reviewer_provider_id, reviewer_model_id, enabled, timeout_seconds]
      additionalProperties: false
      properties:
        reviewer_provider_id: { type: string, maxLength: 255 }
        reviewer_model_id: { type: string, maxLength: 255 }
        enabled: { type: boolean }
        timeout_seconds: { type: integer, minimum: 5, maximum: 120 }
    ModelPricingVersion:
      type: object
      required: [provider_id, model_id, currency, input_per_1k, output_per_1k, effective_at, version, updated_at]
      properties:
        provider_id: { type: string, minLength: 1, maxLength: 255 }
        model_id: { type: string, minLength: 1, maxLength: 255 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        input_per_1k: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        output_per_1k: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        effective_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    ModelPricingCollection:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ModelPricingVersion" }
    UpdateModelPricingVersion:
      type: object
      additionalProperties: false
      required: [provider_id, model_id, currency, input_per_1k, output_per_1k, effective_at, version]
      properties:
        provider_id: { type: string, minLength: 1, maxLength: 255 }
        model_id: { type: string, minLength: 1, maxLength: 255 }
