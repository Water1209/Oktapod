openapi: 3.0.3
info:
  title: Oktapod API
  version: 1.0.0
  description: Contract-first API for the Oktapod V1 control plane.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        "200":
          description: Read-only, secret-safe runtime diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostics"
        default:
          $ref: "#/components/responses/Problem"
  /configuration:
    get:
      operationId: getConfiguration
      responses:
        "200":
          description: Effective non-secret bootstrap configuration and source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
  /configuration/bootstrap:
    patch:
      operationId: updateBootstrapConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBootstrapConfiguration" }
      responses:
        "200":
          description: Saved bootstrap configuration; restart_required is true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/ai-governance:
    get:
      operationId: getAIGovernanceSettings
      responses:
        "200":
          description: Reviewer configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIGovernanceSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateAIGovernanceSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAIGovernanceSettings" }
      responses:
        "200":
          description: Updated Reviewer configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIGovernanceSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/model-pricing:
    get:
      operationId: getModelPricing
      responses:
        "200":
          description: Versioned model pricing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPricingCollection" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateModelPricing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModelPricingCollection" }
      responses:
        "200":
          description: Updated versioned model pricing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPricingCollection" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/context:
    get:
      operationId: getContextSettings
      responses:
        "200":
          description: Conversation context settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateContextSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContextSettings" }
      responses:
        "200":
          description: Updated conversation context settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /preferences:
    get:
      operationId: getPreferences
      responses:
        "200":
          description: Current user preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserPreferences" }
      responses:
        "200":
          description: Updated user preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        default: { $ref: "#/components/responses/Problem" }
  /security/vault:
    get:
      operationId: getVaultStatus
      responses:
        "200":
          description: Secret vault status without key material
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /security/vault/initialize:
    post:
      operationId: initializeVault
      responses:
        "200":
          description: Pending vault and one-time recovery code
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultSecretResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /security/vault/confirm:
    post:
      operationId: confirmVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultRecoveryRequest" }
      responses:
        "200":
          description: Active vault status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /security/vault/recover:
    post:
      operationId: recoverVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultRecoveryRequest" }
      responses:
        "200":
          description: Recovered vault status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /security/vault/rotate-recovery:
    post:
      operationId: rotateVaultRecovery
      responses:
        "200":
          description: New one-time recovery code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultSecretResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /security/vault/reset-pending:
    post:
      operationId: resetPendingVault
      responses:
        "204": { description: Pending vault removed }
        default: { $ref: "#/components/responses/Problem" }
  /bootstrap:
    get:
      operationId: getBootstrap
      responses:
        "200":
          description: Non-sensitive bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
  /models:
    get:
      operationId: listModels
      responses:
        "200":
          description: Provider-advertised chat-capable models
          content:
            application/json:
              schema:
                type: object
                required: [items, default_model]
                properties:
                  default_model:
                    type: string
                    description: 当前运行时解析出的默认模型 ID
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelDescriptor"
        default:
          $ref: "#/components/responses/Problem"
  /providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: Organization-owned provider instances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderInstance" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveProviderRequest" }
      responses:
        "201":
          description: Provider instance created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderInstance" }
        default: { $ref: "#/components/responses/Problem" }
  /providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    get:
      operationId: getProvider
      responses:
        "200":
          description: Provider instance details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderInstance" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveProviderRequest" }
      responses:
        "200":
          description: Provider instance updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderInstance" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProvider
      responses:
        "204":
          description: Provider instance and its credential removed
        default: { $ref: "#/components/responses/Problem" }
  /providers/{provider_id}/test:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    post:
      operationId: testProvider
      responses:
        "200":
          description: Redacted provider connectivity result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        default: { $ref: "#/components/responses/Problem" }
  /providers/{provider_id}/models:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    get:
      operationId: listProviderModels
      responses:
        "200":
          description: Cached provider model catalog merged with the user-enabled list; this request never accesses the Provider network
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderModelOption" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveProviderModelsRequest" }
      responses:
        "200":
          description: Enabled models and default model saved atomically
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderModelOption" }
        default: { $ref: "#/components/responses/Problem" }
  /providers/{provider_id}/models/refresh:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 255 }
    post:
      operationId: refreshProviderModels
      responses:
        "200":
          description: Provider API catalog refreshed; existing enabled choices are preserved
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderModelOption" }
        default: { $ref: "#/components/responses/Problem" }
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Visible projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    post:
      operationId: createAuthSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthSessionRequest"
      responses:
        "201":
          description: Short-lived Team session token (returned once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeAuthSession
      responses:
        "204":
          description: Session revoked
        default:
          $ref: "#/components/responses/Problem"
  /projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProjectSettings
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectSettingsRequest"
      responses:
        "200":
          description: Project model policy updated by an owner or approver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{project_id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectTasks
      responses:
        "200":
          description: Visible tasks in the project
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "202":
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{project_id}/schedules:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectSchedules
      responses:
        "200":
          description: Permission-filtered schedules in the project
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSchedule
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule created and enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
  /schedules/{schedule_id}/status:
    parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: setScheduleStatus
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [enabled, disabled]
      responses:
        "200":
          description: Schedule status changed by its owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
  /projects/{project_id}/capabilities:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectCapabilities
      responses:
        "200":
          description: Permission-filtered capabilities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Capability" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCapability
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCapabilityRequest" }
      responses:
        "201":
          description: Manifest scanned and registered; risky capabilities are quarantined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        default: { $ref: "#/components/responses/Problem" }
  /resource-catalog:
    get:
      operationId: listResourceCatalog
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Project used to authorize the current user and anchor global preset installation.
      responses:
        "200":
          description: Signed preset catalog merged with the current user's durable install or delete state
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PresetResourceCatalogItem" }
        default: { $ref: "#/components/responses/Problem" }
  /resource-catalog/{preset_key}:install:
    parameters:
      - name: preset_key
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9][a-z0-9-]*$" }
    post:
      operationId: installPresetResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              additionalProperties: false
              properties:
                project_id: { type: string, format: uuid }
      responses:
        "200":
          description: Preset resource restored or advanced to the catalog-managed version; dependencies are installed first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteCapability
      responses:
        "204":
          description: Capability deleted after active Run reference checks; historical snapshots and redacted audit records are retained
        default: { $ref: "#/components/responses/Problem" }
  /projects/{project_id}/resource-install-drafts:resolve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: resolveResourceInstallDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_input]
              additionalProperties: false
              properties:
                source_input:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: Natural-language MCP name, Registry identifier, server.json, URL, fixed package, or local command. Secret values are rejected.
      responses:
        "200":
          description: Side-effect-free MCP source resolution. Ambiguous Registry searches return candidates and require an explicit user choice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceInstallDraft" }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}/status:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setCapabilityStatus
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [enabled, disabled, quarantined] }
      responses:
        "200":
          description: Capability status changed by owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}/review:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewCapability
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCapabilityRequest" }
      responses:
        "200":
          description: Explicit owner or approver review of a quarantined capability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        default:
          $ref: "#/components/responses/Problem"
  /capabilities/{capability_id}/mcp/connect:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: connectMCP
      responses:
        "200":
          description: MCP handshake completed and tool metadata recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPHealth" }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}/mcp/credential:
    put:
      operationId: updateMCPCredential
      parameters:
        - name: capability_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPSecretUpdateRequest" }
      responses:
        "200":
          description: MCP credential replaced; values are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}/mcp/oauth/start:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: startMCPOAuth
      responses:
        "200":
          description: OAuth browser authorization session prepared; no token or protocol state is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPOAuthSession" }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}/mcp/oauth/{session_id}:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMCPOAuthStatus
      responses:
        "200":
          description: Short-lived OAuth authorization status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPOAuthSession" }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}/mcp/oauth/{session_id}/cancel:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelMCPOAuth
      responses:
        "200":
          description: OAuth authorization canceled without deleting the MCP definition or workspace changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPOAuthSession" }
        default: { $ref: "#/components/responses/Problem" }
  /mcp/oauth/callback:
    get:
      operationId: completeMCPOAuth
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 16, maxLength: 1024 }
        - name: code
          in: query
          schema: { type: string, maxLength: 8192 }
        - name: iss
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: error
          in: query
          schema: { type: string, maxLength: 256 }
        - name: error_description
          in: query
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Minimal browser callback page; the opener polls the status endpoint and closes this window
          content:
            text/html:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /capabilities/{capability_id}/mcp/disconnect:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: disconnectMCP
      responses:
        "200":
          description: MCP connection disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPHealth" }
        default: { $ref: "#/components/responses/Problem" }
